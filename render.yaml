services:
  - type: web
    name: olx-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: CHECK_INTERVAL_MINUTES
        value: "10"
      - key: MAX_ADS_PER_CHECK
        value: "10"
      - key: REQUEST_TIMEOUT
        value: "15"
      - key: DB_PATH
        value: data/olx_bot.db
